<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Pallets | Adega Brasil</title>
  <style>
    html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; }
    iframe { display: block; }
    button { position: fixed; bottom: 12px; right: 12px; padding: 8px; }
  </style>
</head>
<body>
  <iframe id="painel" title="Controle de pallets" allowfullscreen
    src="https://script.google.com/macros/s/AKfycbwSQfVe189IDmRzNsLE5-4MLIzZ-H4jwrJzQHvJXvg99nyxT7WgBKEKIZkdSqbcT7ad-w/exec"></iframe>
  <button id="ampliar" type="button">Tela cheia</button>
  <script>
    const ampliar = document.getElementById('ampliar');
    ampliar.hidden = !document.fullscreenEnabled;
    ampliar.addEventListener('click', async () => {
      try {
        await document.getElementById('painel').requestFullscreen();
      } catch {
        ampliar.textContent = 'Tela cheia indisponível';
      }
    });
  </script>
</body>
</html>
