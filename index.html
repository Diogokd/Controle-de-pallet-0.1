
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Sistema Integrado</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: none;
      display: block;
      background: #fff;
    }
  </style>
</head>

<body>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwSQfVe189IDmRzNsLE5-4MLIzZ-H4jwrJzQHvJXvg99nyxT7WgBKEKIZkdSqbcT7ad-w/exec"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

</body>
</html>
