
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Sistema Integrado</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    #fullscreenBtn {
      position: fixed;
      z-index: 10;
      right: 15px;
      top: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background: rgba(0,0,0,.75);
      color: white;
      cursor: pointer;
      font-size: 13px;
    }

    #fullscreenBtn:hover {
      background: #333;
    }
  </style>
</head>

<body>

  <div id="container">

    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbxRIzygEpZJZ_rKVuq19mWR7Aj26HudXhrok5LuWNhjMvby1YhMmMG-9IlF1iT__wpNg/exec"
      allow="fullscreen"
      allowfullscreen>
    </iframe>

  </div>

  <button id="fullscreenBtn" type="button">
    ⛶ Tela cheia
  </button>

  <script>
    const iframe = document.getElementById('appFrame');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    fullscreenBtn.addEventListener('click', async function () {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.textContent = '✕ Sair da tela cheia';
        } else {
          await document.exitFullscreen();
          fullscreenBtn.textContent = '⛶ Tela cheia';
        }
      } catch (error) {
        console.error('Erro ao ativar tela cheia:', error);
      }
    });

    document.addEventListener('fullscreenchange', function () {
      fullscreenBtn.textContent = document.fullscreenElement
        ? '✕ Sair da tela cheia'
        : '⛶ Tela cheia';
    });

    iframe.addEventListener('load', function () {
      console.log('Iframe carregado.');
    });

    iframe.addEventListener('error', function () {
      console.error('Falha ao carregar o iframe.');
    });
  </script>

</body>
</html>
